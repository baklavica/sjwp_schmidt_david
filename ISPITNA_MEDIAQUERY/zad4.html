<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        body {
            margin: 0;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            gap: 10px;
        }
        .container div {
            background-color: #ccc;
            height: 100vh;
            width: 100vw;
        }

        @media (min-width: 768px) and (max-width: 1023px) {
            .container {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(3, 1fr);
                height: 100%;
                gap: 10px;
            }
            .container div {
                height: 32.6vh;
                width: 100%;
            }
            .zadaci {
                grid-row: 3 / 4;
                grid-column: 1 / 3;
            }
        }

        @media (max-width: 767px) {
            .container {
                display: grid;
                grid-template-columns: 1fr;
                grid-template-rows: repeat(5, 1fr);
                height: 100%;
                gap: 10px;
            }
            .container div {
                height: 19.15vh;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="korisnici">Korisnici</div>
        <div class="prodaja">Prodaja</div>
        <div class="poruke">Poruke</div>
        <div class="konverzija">Konverzija</div>
        <div class="zadaci">Zadaci</div>
    </div>
</body>
</html>
