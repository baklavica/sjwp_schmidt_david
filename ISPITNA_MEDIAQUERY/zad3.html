<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            margin: 0;
            box-sizing: border-box;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            height: 100%;
            gap: 10px;
        }

        .container div {
            background-color: #ccc;
            width: 100%;
            height: 24.2vh;
        }

        @media (min-width: 768px) and (max-width: 1023px) {
            body {
                overflow-y: hidden;
            }
            .container {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(6, 1fr);
            }
            .container div {
                height: 15.8vh;
            }
        }
        
        @media (max-width: 767px) {
            body {
                overflow-y: hidden;
            }
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(12, 1fr);
            }
            .container div {
                height: 7.35vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="proizvod1">proizvod 1</div>
        <div class="proizvod2">proizvod 2</div>
        <div class="proizvod3">proizvod 3</div>
        <div class="proizvod4">proizvod 4</div>
        <div class="proizvod5">proizvod 5</div>
        <div class="proizvod6">proizvod 6</div>
        <div class="proizvod7">proizvod 7</div>
        <div class="proizvod8">proizvod 8</div>
        <div class="proizvod9">proizvod 9</div>
        <div class="proizvod10">proizvod 10</div>
        <div class="proizvod11">proizvod 11</div>
        <div class="proizvod12">proizvod 12</div>
    </div>
</body>
</html>
